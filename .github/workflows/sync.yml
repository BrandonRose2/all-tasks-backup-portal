name: Sync Manus Tasks

on:
  schedule:
    # Runs every Friday at 4:00 AM PST (12:00 UTC)
    - cron: "0 12 * * 5"
  workflow_dispatch:
    inputs:
      archive_mode:
        description: "Archive selection: updated only, missing only, or every task"
        required: false
        default: "updated"
        type: choice
        options:
          - updated
          - missing
          - full
      max_tasks:
        description: "Maximum task archives to process (0 means no limit)"
        required: false
        default: "0"
        type: string
      download_artifacts:
        description: "Download task attachments into the public archive when possible"
        required: false
        default: true
        type: boolean
      notify_email:
        description: "Send the configured completion email for this manual run"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Refresh Manus task index
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: python scripts/sync_tasks.py

      - name: Archive Manus conversations and attachments
        id: archive
        continue-on-error: true
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          MODE="${{ inputs.archive_mode || 'updated' }}"
          MAX_TASKS="${{ inputs.max_tasks || '0' }}"
          ARGS=(--mode "$MODE" --max-tasks "$MAX_TASKS")
          if [[ "${{ inputs.download_artifacts }}" == "false" ]]; then
            ARGS+=(--skip-artifacts)
          fi
          python scripts/archive_task_materials.py "${ARGS[@]}"

      - name: Check for changes
        id: changes
        run: |
          if [[ -n "$(git status --porcelain -- client/public/tasks_data.json client/public/archives/manus)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Get archive summary
        id: summary
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          tasks = json.loads(Path("client/public/tasks_data.json").read_text())
          manifest_path = Path("client/public/archives/manus/manifest.json")
          manifest = json.loads(manifest_path.read_text()) if manifest_path.exists() else {}
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"tasks={tasks.get('meta', {}).get('total', len(tasks.get('tasks', [])))}\n")
              output.write(f"archived={manifest.get('complete_task_count', 0)}\n")
              output.write(f"partial={manifest.get('partial_artifact_task_count', 0)}\n")
              output.write(f"failed={manifest.get('failed_task_count', 0)}\n")
          PY

      - name: Commit and push refreshed archive
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Manus Sync Bot"
          git config user.email "sync-bot@manus-dashboard.local"
          git add client/public/tasks_data.json client/public/archives/manus
          git commit -m "chore: archive Manus tasks — ${{ steps.summary.outputs.tasks }} indexed / ${{ steps.summary.outputs.archived }} complete [$(TZ='America/Los_Angeles' date '+%Y-%m-%d %H:%M PST')]"
          git push

      - name: Prepare lightweight Pages artifact
        if: steps.changes.outputs.changed == 'true'
        run: |
          rm -rf _site
          mkdir -p _site/client/public/archives/manus

          cp index.html _site/index.html
          cp client/public/tasks_data.json _site/client/public/tasks_data.json
          cp client/public/archives/manus/manifest.json _site/client/public/archives/manus/manifest.json
          cp -R client/public/archives/manus/tasks _site/client/public/archives/manus/tasks

          for file in \
            case-notes-and-strategy.md \
            Report_Nicole_Ginger_Sandra_Demotion.pdf \
            ApartmentCorp_Indeed_Job_Listing.md \
            ApartmentCorp_Indeed_Job_Listing.pdf \
            Robert_Sagarang_Case_Monitor_Dashboard.html; do
            if [[ -f "$file" ]]; then
              cp "$file" _site/
            fi
          done

          touch _site/.nojekyll
          du -sh _site

      - name: Configure Pages
        if: steps.changes.outputs.changed == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.changes.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy updated Pages portal
        if: steps.changes.outputs.changed == 'true'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: No changes detected
        if: steps.changes.outputs.changed != 'true'
        run: echo "No Manus task or archive changes detected."

      - name: Send email notification
        if: always() && (github.event_name == 'schedule' || inputs.notify_email == true)
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: brandonrose2@gmail.com
          password: ${{ secrets.GMAIL_APP_PASSWORD }}
          subject: "Manus Task Archive — ${{ steps.summary.outputs.tasks || 'unknown' }} tasks [${{ job.status }}]"
          to: brandon@apartmentcorp.com,brandonrose2@gmail.com
          from: "Manus Sync Bot <brandonrose2@gmail.com>"
          body: |
            Manus task archive synchronization completed.

            Status: ${{ job.status }}
            Indexed tasks: ${{ steps.summary.outputs.tasks || 'unknown' }}
            Complete task archives: ${{ steps.summary.outputs.archived || '0' }}
            Archives with referenced-only attachments: ${{ steps.summary.outputs.partial || '0' }}
            Failed task archives: ${{ steps.summary.outputs.failed || '0' }}
            Archive mode: ${{ inputs.archive_mode || 'updated' }}

            Portal: https://brandonrose2.github.io/all-tasks-backup-portal/
            Workflow run: https://github.com/BrandonRose2/all-tasks-backup-portal/actions
